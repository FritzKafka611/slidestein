[project]
name = "slidestein"
version = "0.1.0"
description = "AI consulting slide generator — one slide at a time"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-pptx>=1.0.0",
    "lancedb>=0.13.0",
    "comtypes>=1.4.17",
    "sap-ai-sdk-gen>=7.4.1",
    "pillow>=10.0.0",
]

[project.scripts]
slidestein = "slidestein.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidestein"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires PowerPoint or LibreOffice to be installed (deselect with -m 'not integration')",
]
